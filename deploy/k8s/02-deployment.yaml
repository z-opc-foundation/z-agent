# ============================================================
# z-agent —— Deployment（工作负载）
#
# 【2026-10-22 更新：工厂从"永远起不来"修到"可用"】
#   旧镜像 zopc/z-agent:local 里装的是 2026-10-19 构建的 jar，
#   容器启动必崩：
#     Field instanceMapper in ...AgentAuthInterceptor required a bean named
#     'sqlSessionFactoryConfig' that could not be found.
#   根因：那个 bean 一直由 z-team-starter 的 TeamSqlSessionFactoryConfig 提供，
#   而 z-agent-center 独立部署时没有 z-team-starter ⇒ 无人提供。
#   修法（源码侧）：z-agent-center-starter 新增 AgentCenterDataSourceConfig
#   自持 DataSource + sqlSessionFactory + sqlSessionFactoryConfig 别名；
#   同时把 Main 的 @MapperScan 从整包收窄到精确 mapper 包
#   （整包会把 service 接口也注册成 mapper ⇒ AgentAkService 双 bean 冲突）。
#   新镜像：zopc/z-agent:1.0.3-r2（构建定义见 ../Dockerfile）
#
# 【镜像 tag 为什么这样写】
#   image: zopc/z-agent:1.0.3-r2
#   —— 裸 tag，**不带 Nexus 仓库前缀**。铁律：本集群 imagePullPolicy=Never，
#      镜像只存在于两个节点的 containerd，不在任何 registry。k3s 不会去拉，
#      它按 `image:` 字段的**字面引用**去节点本地 content store 里找。
#      如果喂进 containerd 的 tag 带前缀（例如 nexus.internal/zopc/z-agent:1.0.3-r2）
#      而清单里写的是裸 tag（或反过来）⇒ **ErrImageNeverPull**。
#   imagePullPolicy: Never
#   —— 照抄线上。改成 IfNotPresent 也不会更安全（节点上没有 registry 可用），
#      但会让"本地有镜像"这条隐含前提失效，排查时更难定位。
#
# 【探针为什么换成 httpGet】
#   2026-10-19 那版用 tcpSocket，理由是"本域 0 副本，HTTP 端点无法实测"。
#   现在本域已拉起 1 副本并实测过真实端点 ⇒ 直接用 httpGet 打
#   /api/agent/template/health（200 {"success":true,"data":"Agent Template API is healthy"}），
#   探针才真的能判"应用活着"，而不是只判"端口在监听"。
#   ⚠ 换探针前必须先实测该 path 返回 200 —— 用 `curl -o /dev/null -w '%{http_code}'
#     http://<node>:31893/api/agent/template/health` 验，别照抄。
#
# 【secret 从哪来】
#   Z_BASE_DB_CONFIG_PASSWORD → secretKeyRef: secret z-agent-db / 键 password。
#   secret z-agent-db 已在集群里（手工灌的），本仓不写它的内容。
#   重建集群时按 README §3 的命令补灌。
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: z-agent-center
  namespace: z-agent
  labels:
    app.kubernetes.io/name: z-agent-center
    app.kubernetes.io/part-of: z-opc-foundation
spec:
  # 2026-10-22：从 0 拉起为 1 —— 独立工厂修好后已实测可用
  # （健康端点 200、app/list 返回真实 z_agent_app 数据、POST /api/agent/app 真能造出 agent）。
  # 留 10 个历史版本 ⇒ `kubectl rollout undo deploy/z-agent-center -n z-agent` 可用。
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: z-agent-center
  template:
    metadata:
      labels:
        app.kubernetes.io/name: z-agent-center
    spec:
      containers:
        - name: z-agent
          image: zopc/z-agent:1.0.3-r2
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # JVM 参数：与线上逐字一致。
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx1024m"
            # ===== 数据源：共享 RDS 的 oc 库（z-opc 系各仓共用同一个库）=====
            # 地址/账号照线上现状明文（要求「集群可从代码复现」⇒ 与线上一字不差）；
            # 口令一律走 secret 引用，仓里不出现明文口令。
            # ⚠ 这 5 个 env 正是 AgentCenterDataSourceConfig 里 buildDataSource(env, "config")
            #   读取的键（Spring relaxed binding：Z_BASE_DB_CONFIG_HOST → z.base.db.config.host）。
            #   少任何一个 ⇒ 数据源回落 localhost ⇒ 连不上库 ⇒ 启动即失败。
            - name: Z_BASE_DB_CONFIG_HOST
              value: rm-bp108uqlgwn712k54ho.mysql.rds.aliyuncs.com
            - name: Z_BASE_DB_CONFIG_PORT
              value: "3306"
            - name: Z_BASE_DB_CONFIG_DATABASE
              value: oc
            - name: Z_BASE_DB_CONFIG_USERNAME
              value: zifang
            - name: Z_BASE_DB_CONFIG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: z-agent-db
                  key: password
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: 300m
              memory: 1280Mi
          # 探针打真实业务端点（2026-10-22 实测 200）。
          readinessProbe:
            httpGet:
              path: /api/agent/template/health
              port: http
            initialDelaySeconds: 40
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/agent/template/health
              port: http
            # 启动比就绪慢：JVM 起 + 连 RDS，放宽到 120s 再开始判活。
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 6
