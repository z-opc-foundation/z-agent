# ============================================================
# z-agent —— Service（NodePort）
# 线上实况（/tmp/zdeploy-base/z-agent.yaml 导出为准）：
#   Service  z-agent-center  NodePort  8080 → targetPort http  nodePort 31893
#   selector app.kubernetes.io/name=z-agent-center
#
# 端口与 NodePort 号**照抄线上**，不重新分配：
#   NodePort 31893 是既成事实，换号会让外部调用方（边缘 nginx / 宿主机排障直连）
#   全部失联，而这种「改号」的收益为零。
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: z-agent-center
  namespace: z-agent
  labels:
    app.kubernetes.io/name: z-agent-center
    app.kubernetes.io/part-of: z-opc-foundation
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: z-agent-center
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 31893
