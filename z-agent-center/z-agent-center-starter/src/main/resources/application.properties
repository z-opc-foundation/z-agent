# ============================================================
# z-agent-center 独立部署配置
# ------------------------------------------------------------
# 背景：z-agent-center 从主壳 z-opc 里拆出来独立部署后，容器启动即失败
#   Field instanceMapper in ...AgentAuthInterceptor required a bean named
#   'sqlSessionFactoryConfig' that could not be found.
# 根因：那个 bean 一直由 z-team-starter 的 TeamSqlSessionFactoryConfig 提供；
#       独立进程里没有 z-team-starter ⇒ 无人提供 ⇒ 启动必崩。
#       z-boot-datasource-starter 只提供辅助类（ModuleDataSourceTemplate），
#       **不带 spring.factories**，不会自动装配数据源 —— 每个独立服务必须自持。
# 修法：AgentCenterDataSourceConfig（starter 模块内）自持 DataSource +
#       sqlSessionFactory + sqlSessionFactoryConfig 别名。
# ============================================================

server.port=8080
spring.application.name=z-agent-center

# 与主壳同口径：z-team-starter 的 z-team 业务模块预存循环依赖
# （agentInstances ↔ teamTeamAgentExecutor）。独立实例跑同一批 bean，
# 循环依赖的成因相同 ⇒ 口径保持一致，不要在这里单方面关掉。
spring.main.allow-circular-references=true
spring.main.allow-bean-definition-overriding=true

# ===== 数据源 =====
# 模块名 config：与既有部署清单 env 前缀 Z_BASE_DB_CONFIG_* 逐字对齐
#（AgentCenterDataSourceConfig#buildDataSource(env, "config")）。
# host / port / username / password 由部署清单以 env 注入（口令走 secret z-agent-db），
# 这里**不写明文默认值** —— 库地址回落本机时启动期会挂死而不是报错。
# 缺省逐项回退 z.base.db.default.*（ModuleDataSourceTemplate 内置逻辑）。
z.base.db.config.host=${Z_BASE_DB_CONFIG_HOST:}
z.base.db.config.port=${Z_BASE_DB_CONFIG_PORT:3306}
z.base.db.config.database=${Z_BASE_DB_CONFIG_DATABASE:oc}
z.base.db.config.username=${Z_BASE_DB_CONFIG_USERNAME:}
z.base.db.config.password=${Z_BASE_DB_CONFIG_PASSWORD:}
# JDBC 超时上限：RDS 抖动时连接卡住会导致探针判死（见 ModuleDataSourceTemplate 注释）。
z.base.db.config.connect-timeout=3000
z.base.db.config.socket-timeout=10000
z.base.db.config.max-wait=60000

# ===== MyBatis-Plus =====
# 语义开关已在 AgentCenterDataSourceConfig 里与主壳逐项对齐
#（驼峰映射 / 逻辑删除 deleted / 分页拦截器）。这里再写一份 yml 形态的，
# 是为了让 MybatisPlusAutoConfiguration 读到的 properties 与代码里的显式设置一致，
# 避免"属性文件说 A、代码做 B"这种双份真相。
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ===== 日志 =====
logging.level.com.zifang.z.agent=INFO
